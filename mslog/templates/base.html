<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}납품물량 자동 인식·검증{% endblock %} - MS가스</title>
<style>
  /* docs/DESIGN-apple.md 토큰 적용. 기존 템플릿이 쓰는 변수명(--bg, --card …)은 유지한다. */
  :root {
    --primary:#0066cc; --primary-focus:#0071e3; --primary-on-dark:#2997ff;
    --ink:#1d1d1f; --ink-80:#333333; --ink-48:#7a7a7a;
    --canvas:#ffffff; --parchment:#f5f5f7; --pearl:#fafafc; --black:#000000;
    --hairline:#e0e0e0; --divider-soft:#f0f0f0;
    --tile-1:#272729;

    --bg:var(--parchment); --card:var(--canvas); --line:var(--hairline);
    --mute:var(--ink-48); --brand:var(--primary);
    /* 상태 표시 전용(상호작용 색 아님). 두 번째 강조색을 만들지 않도록 채도를 낮춰 사용 */
    --ok:#1d7a46; --warn:#a15c00; --err:#c4281c; --unc:#fff6dd;

    --font:"SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --font-display:"SF Pro Display", system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink:#ffffff; --ink-80:#cccccc; --ink-48:#a1a1a6;
      --bg:#000000; --card:var(--tile-1); --line:#3a3a3c; --mute:#a1a1a6;
      --brand:var(--primary-on-dark); --primary:#0071e3;
      --ok:#4cc38a; --warn:#e0a13a; --err:#ff8a80; --unc:#3d3416;
      --pearl:#2a2a2c; --divider-soft:#3a3a3c;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:400 14px/1.43 var(--font); letter-spacing:-0.224px; background:var(--bg); color:var(--ink);
         -webkit-font-smoothing:antialiased; }
  a { color:var(--brand); text-decoration:none; } a:hover { text-decoration:underline; }

  /* global-nav: 44px 블랙 바 */
  header { position:sticky; top:0; z-index:10; background:var(--black); color:#fff; height:44px; padding:0 24px;
           display:flex; align-items:center; gap:28px; }
  header .brand { font:600 14px/1 var(--font); letter-spacing:-0.224px; margin-right:8px; }
  header a { color:#fff; font-size:12px; letter-spacing:-0.12px; opacity:.85; }
  header a:hover { opacity:1; text-decoration:none; }
  header .sp { flex:1; }
  header form { display:flex; gap:8px; align-items:center; margin:0; font-size:12px; letter-spacing:-0.12px; }
  header input[type=text] { background:#1d1d1f; color:#fff; border:0; height:26px; border-radius:8px; padding:0 10px; }
  header .nav-btn { background:transparent; color:var(--primary-on-dark); border:1px solid var(--primary-on-dark);
                    height:26px; padding:0 12px; font-size:12px; }

  main { padding:32px 24px 80px; max-width:1440px; margin:0 auto; }
  h1 { font:600 34px/1.2 var(--font-display); letter-spacing:-0.374px; margin:8px 0 24px; }
  h2 { font:600 21px/1.19 var(--font-display); letter-spacing:0.231px; margin:0 0 16px; }
  p { font-size:17px; line-height:1.47; letter-spacing:-0.374px; }

  /* store-utility-card: 흰 카드, 1px 헤어라인, 18px, 그림자 없음 */
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; margin-bottom:24px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { border-bottom:1px solid var(--line); padding:10px 12px; text-align:left; vertical-align:top; }
  th { font-weight:600; color:var(--ink-80); white-space:nowrap; background:transparent; }
  tr:last-child td { border-bottom:0; }
  td.r, th.r { text-align:right; font-variant-numeric:tabular-nums; }

  input, select, textarea, button { font:inherit; letter-spacing:inherit; color:inherit; }
  input[type=text], input[type=date], input[type=search], select, textarea {
    background:var(--card); border:1px solid rgba(0,0,0,.16); border-radius:8px; padding:8px 12px; min-height:36px; }
  @media (prefers-color-scheme: dark) { input[type=text], input[type=date], input[type=search], select, textarea { border-color:#48484a; } }
  input[type=search] { border-radius:9999px; padding:0 20px; min-height:44px; font-size:17px; letter-spacing:-0.374px; }
  input[type=file] { font-size:14px; }
  :focus-visible { outline:2px solid var(--primary-focus); outline-offset:2px; }

  /* button-primary: Action Blue 필 */
  button, .btn { background:var(--primary); color:#fff; border:1px solid var(--primary); border-radius:9999px;
                 padding:8px 20px; min-height:36px; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block;
                 transition:transform .12s ease; }
  button:active, .btn:active { transform:scale(0.95); }
  .btn:hover { text-decoration:none; }
  /* button-secondary-pill: 고스트 필 */
  button.sec, .btn.sec { background:transparent; color:var(--brand); border-color:var(--brand); }
  /* button-dark-utility: 파괴적 동작(제외)도 두 번째 강조색 없이 다크 유틸리티로 */
  button.danger { background:var(--ink); color:var(--canvas); border-color:var(--ink); border-radius:8px; }
  @media (prefers-color-scheme: dark) { button.danger { background:#fff; color:#000; border-color:#fff; } }

  .flash { padding:12px 16px; border-radius:11px; margin-bottom:12px; background:var(--card); border:1px solid var(--line);
           font-size:14px; }
  .flash.ok { border-left:4px solid var(--ok); }
  .flash.error { border-left:4px solid var(--err); }

  .tag { display:inline-block; padding:1px 10px; border-radius:9999px; font-size:12px; letter-spacing:-0.12px;
         border:1px solid var(--line); background:transparent; }
  .tag.err { color:var(--err); border-color:var(--err); } .tag.warn { color:var(--warn); border-color:var(--warn); }
  .tag.ok { color:var(--ok); border-color:var(--ok); } .tag.mute { color:var(--mute); }
  .mute { color:var(--mute); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; gap:24px; }
  @media (min-width: 1000px) { .split { grid-template-columns: minmax(320px, 5fr) 7fr; } }
  .unc { background:var(--unc); border-color:var(--warn) !important; }
  .viewer { position:sticky; top:68px; max-height:calc(100vh - 92px); overflow:auto; }
  .viewer img { max-width:100%; border-radius:8px; } .viewer iframe { width:100%; height:80vh; border:0; }
  .fields { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .fields label { display:block; font-size:12px; letter-spacing:-0.12px; color:var(--mute); }
  .fields input, .fields select { width:100%; color:var(--ink); }

  /* 상단 요약: 숫자를 display 크기로 */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px; margin-bottom:24px; }
  .stat { border:1px solid var(--line); border-radius:18px; padding:20px 24px; background:var(--card); color:var(--ink);
          text-decoration:none; font-size:14px; }
  .stat:hover { text-decoration:none; border-color:var(--brand); }
  .stat b { font:600 40px/1.1 var(--font-display); letter-spacing:0; display:block; margin-bottom:4px; }
  details summary { cursor:pointer; color:var(--brand); }

  @media (max-width: 833px) {
    header { gap:16px; padding:0 16px; overflow-x:auto; } main { padding:24px 16px 64px; }
    h1 { font-size:28px; } .card { padding:16px; }
    .stat b { font-size:28px; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">MS가스 납품물량</span>
  <a href="{{ url_for('index') }}">납품자료</a>
  <a href="{{ url_for('findings') }}">오류 검증</a>
  <a href="{{ url_for('reports') }}">집계·엑셀</a>
  <a href="{{ url_for('masters_page') }}">기준정보</a>
  <span class="sp"></span>
  <form method="post" action="{{ url_for('set_operator') }}">
    <label>담당자 <input type="text" name="operator" value="{{ operator }}" size="8"></label>
    <button class="nav-btn">변경</button>
  </form>
</header>
<main>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
